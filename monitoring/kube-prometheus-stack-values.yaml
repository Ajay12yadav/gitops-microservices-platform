alertmanager:
  enabled: false           # we'll add alerting later if there's memory to spare

# Kind runs these control-plane components bound to localhost, so Prometheus
# can't scrape them and they'd show as permanently "down"
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# Node-exporter often fails on WSL2 + Kind (mount propagation) and we
# don't need it: pod CPU/memory comes from cAdvisor instead
nodeExporter:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    # Scrape ANY ServiceMonitor, not only ones labelled with this release.
    # Removes the classic "my app isn't being scraped" label trap.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits:   { memory: 1Gi }

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.localtest.me
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 384Mi }
