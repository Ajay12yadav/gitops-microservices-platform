{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "myapp.fullname" . }}-db
  labels: {{- include "myapp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "myapp.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.db.existingSecret }}   # the Secret the Deployment already uses
    creationPolicy: Owner
  data:
    {{- range tuple "DB_USER" "DB_PASSWORD" "MYSQL_ROOT_PASSWORD" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.vaultKeyPath }}
        property: {{ . }}
    {{- end }}
{{- end }}
